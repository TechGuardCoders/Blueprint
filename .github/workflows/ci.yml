name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pytest
      - name: teardown aggregation (no siblings in CI, must degrade gracefully)
        run: python blueprint.py
      - name: report artifact exists
        run: test -f report/teardown_data.json && echo OK

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64 + arm64), run tests in-container
        run: docker buildx build --platform linux/amd64,linux/arm64 --target test .
